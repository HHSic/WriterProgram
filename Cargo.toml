[workspace]
resolver = "3"
members = ["crates/ai", "crates/core", "crates/evals", "crates/revise", "crates/sync", "app/src-tauri"]
# The revise engine embeds a large dictionary and is slow to build, so plain
# `cargo build` / `cargo test` skip it and the eval runner built on it. Use
# `-p writer-revise` or `-p writer-evals` to include them.
default-members = ["crates/ai", "crates/core", "crates/sync", "app/src-tauri"]

[workspace.package]
edition = "2024"
