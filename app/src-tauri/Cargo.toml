[package]
name = "writer-app"
version = "0.1.0"
description = "WriterProgram desktop app"
edition.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library apart from the binary on Windows.
name = "writer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
keyring-core = "1"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "unstable": child webviews for the in-app browser (prototype).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
writer-ai = { path = "../../crates/ai" }
writer-core = { path = "../../crates/core" }
writer-sync = { path = "../../crates/sync" }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[dev-dependencies]
tempfile = "3"
