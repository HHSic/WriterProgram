[package]
name = "writer-app"
version = "0.1.12"
description = "WriterProgram desktop app"
edition.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library apart from the binary on Windows.
name = "writer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
base64 = "0.22"
url = "2"
keyring-core = "1"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "unstable": child webviews for the in-app browser (prototype).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
writer-ai = { path = "../../crates/ai" }
# Time stamps for the creation proof (commands/anchor.rs); already in the
# tree through writer-sync.
ureq = "3"
writer-core = { path = "../../crates/core" }
writer-sync = { path = "../../crates/sync" }
# The `writer` command's PATH registration (작품 설정 → AI 도우미 연결).
writer-mcp = { path = "../../crates/mcp" }
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

webview2-com = "=0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
minisign-verify = "0.2"
tempfile = "3"
