[package]
name = "writer-app"
version = "0.1.0"
description = "WriterProgram desktop app"
edition.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library apart from the binary on Windows.
name = "writer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
writer-core = { path = "../../crates/core" }
