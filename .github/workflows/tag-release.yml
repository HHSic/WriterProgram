# One-shot: the session that prepared v0.1.10 may push only its branch, so
# this tags the prepared commit and starts the release workflow from GitHub.
# A tag pushed with GITHUB_TOKEN does not start other workflows, hence the
# explicit dispatch. Remove this file once the release is out.

name: tag-release

on:
  push:
    branches: ['claude/bold-curie-oclyvx']
    paths: ['.github/workflows/tag-release.yml']

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      TAG: v0.1.10
      COMMIT: d255546
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the prepared commit and start the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
