# One-shot: the session that prepared the release may push only its branch,
# so this tags the prepared commit once the release checks pass on Windows
# and starts the release workflow from GitHub. A tag pushed with GITHUB_TOKEN
# does not start other workflows, hence the explicit dispatch. Remove this
# file once the release is out.

name: tag-release

on:
  push:
    branches: ['claude/bold-curie-oclyvx']
    paths: ['.github/workflows/tag-release.yml']

permissions:
  contents: write
  actions: write

env:
  TAG: v0.1.11
  COMMIT: 91be420fbfaad4f853803926b1ab0c2453553227

jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm --prefix app ci
      - name: Same checks as the release build
        run: |
          node scripts/prepare-release.mjs "$TAG"
          npm --prefix app run build
          cargo fmt -p writer-core -p writer-sync -p writer-app -p writer-ai -p writer-mcp --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast
          npm --prefix app test

  tag:
    needs: windows-checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the checked commit and start the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; not moving it."
            exit 1
          fi
          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
