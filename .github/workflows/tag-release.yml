# One-shot: the session that prepared v0.1.10 may push only its branch, so
# this tags the prepared commit and starts the release workflow from GitHub.
# The first v0.1.10 run stopped at a Windows-only test before any release was
# drafted, so the tag moves to the fixed commit once the same checks pass on
# Windows. A tag pushed with GITHUB_TOKEN does not start other workflows,
# hence the explicit dispatch. Remove this file once the release is out.

name: tag-release

on:
  push:
    branches: ['claude/bold-curie-oclyvx']
    paths: ['.github/workflows/tag-release.yml']

permissions:
  contents: write
  actions: write

env:
  TAG: v0.1.10
  COMMIT: dda51c6

jobs:
  windows-checks:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm --prefix app ci
      - name: Same checks as the release build
        run: |
          npm --prefix app run build
          cargo fmt -p writer-core -p writer-sync -p writer-app -p writer-ai -p writer-mcp --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked --no-fail-fast
          npm --prefix app test

  tag:
    needs: windows-checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the tag at the checked commit and start the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A $TAG release already exists; not moving the tag."
            exit 1
          fi
          git tag -f "$TAG" "$COMMIT"
          git push -f origin "refs/tags/$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
