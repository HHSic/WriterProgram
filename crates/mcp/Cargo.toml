[package]
name = "writer-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP server and CLI that let an AI assistant read and write WriterProgram project folders"
publish = false

[lib]
name = "writer_mcp"
path = "src/lib.rs"

[[bin]]
name = "writer-mcp"
path = "src/main.rs"

# The same tools as shell commands (src/cli.rs, docs/cli.md).
[[bin]]
name = "writer"
path = "src/bin/writer.rs"

[dependencies]
chrono = "0.4"
regex = "1"
serde_json = "1"
writer-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
