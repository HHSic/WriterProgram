[package]
name = "writer-sync"
version = "0.1.0"
edition.workspace = true
description = "Keeps a WriterProgram project in step with Google Drive, OneDrive or Dropbox without a server of ours"
publish = false

[lib]
name = "writer_sync"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = "0.4"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "3"
url = "2"
writer-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
url = "2"
