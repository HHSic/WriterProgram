[package]
name = "writer-evals"
version = "0.1.0"
edition.workspace = true
description = "Eval runner for context-fitting sentence candidates (docs/context-sentences.md)"
publish = false

[[bin]]
name = "context-eval"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
writer-ai = { path = "../ai" }
writer-revise = { path = "../revise" }
