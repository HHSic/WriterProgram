[package]
name = "writer-core"
version = "0.1.0"
edition.workspace = true
description = "Project folder format, manuscript files, counts, records and export for WriterProgram"
publish = false

[lib]
name = "writer_core"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
