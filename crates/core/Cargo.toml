[package]
name = "writer-core"
version = "0.1.0"
edition.workspace = true
description = "Project folder format, manuscript files, counts, records and export for WriterProgram"
publish = false

[lib]
name = "writer_core"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
encoding_rs = "0.8"
quick-xml = "0.42"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

# Free disk room (statvfs) on macOS and phones; already in the tree via Tauri.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
